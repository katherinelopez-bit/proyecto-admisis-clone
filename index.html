<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Admisión</title>
</head>

<body>

<header>
    <h1>Sistema de Admisión</h1>
    <p>Gestión de postulantes</p>
</header>

<div class="contenedor">

    <aside>
        <h3>Menú</h3>

        <button>Inicio</button>
        <button>Registrar postulante</button>
        <button>Postulantes</button>
        <button>Admisiones</button>
        <button>Reportes</button>
    </aside>

    <main>

        <div class="tarjeta">

            <h2>Registro de Postulante</h2>

            <div class="fila">
                <div class="campo">
                    <label>Nombre</label>
                    <input type="text" placeholder="Ingrese nombre">
                </div>

                <div class="campo">
                    <label>Apellidos</label>
                    <input type="text" placeholder="Ingrese apellidos">
                </div>
            </div>

            <div class="fila">
                <div class="campo">
                    <label>C.I.</label>
                    <input type="text" placeholder="Número de carnet">
                </div>

                <div class="campo">
                    <label>Fecha de nacimiento</label>
                    <input type="date">
                </div>
            </div>

            <div class="fila">
                <div class="campo">
                    <label>Correo electrónico</label>
                    <input type="email" placeholder="correo@ejemplo.com">
                </div>

                <div class="campo">
                    <label>Teléfono</label>
                    <input type="text" placeholder="Número de teléfono">
                </div>
            </div>

            <div class="fila">
                <div class="campo">
                    <label>Carrera</label>

                    <select>
                        <option>Seleccione una carrera</option>
                        <option>Ingeniería de Sistemas</option>
                        <option>Contaduría Pública</option>
                        <option>Administración</option>
                        <option>Ingeniería Civil</option>
                    </select>
                </div>
            </div>

            <button class="guardar">
                Guardar Postulante
            </button>

        </div>

    </main>

</div>

</body>
</html>
